<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cavoti Bar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M5 19V9m7 10V5m7 14v-7"/><path d="M3 19h18"/></symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></symbol>
    <symbol id="icon-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13.5 1.2 1-.2 1.8-1.5 1-1.6-.5-1.2.9-.2 1.7-1.7.6-1.3-1.2h-1.6l-1.3 1.2-1.7-.6-.2-1.7-1.2-.9-1.6.5-1.5-1 .2-1.8 1.2-1v-1.8l-1.2-1L4 8.9l1.5-1 1.6.5 1.2-.9.2-1.7 1.7-.6 1.3 1.2h1.6l1.3-1.2 1.7.6.2 1.7 1.2.9 1.6-.5 1.5 1-.2 1.8-1.2 1z"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M19 8a7 7 0 1 0 1 6"/><path d="M19 4v4h-4"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="icon-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="m12 4 8 15H4z"/><path d="M12 9v4M12 16h.01"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="m8 5 8 0 1 5-2 2v6l-3-2-3 2v-6l-2-2z"/><path d="M12 18v3"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.1 3.1-5 7-5s6.2 1.9 7 5"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar" data-drag-region>
      <button class="brand" data-view="overview" aria-label="Open overview" title="Open overview">
        <span class="brand-mark">CV</span>
        <span class="brand-copy"><strong>Cavoti</strong><small>usage surface</small></span>
      </button>
      <div class="topbar-state" aria-label="Data source">
        <span class="status-dot neutral"></span>
        <span id="sync-label">Waiting for snapshot</span>
      </div>
      <div class="window-actions">
        <button class="icon-button" data-action="minimize" aria-label="Minimize window" title="Minimize"><svg class="icon"><use href="#icon-minimize"></use></svg></button>
        <button class="icon-button close" data-action="close" aria-label="Close window" title="Close"><svg class="icon"><use href="#icon-close"></use></svg></button>
      </div>
    </header>

    <div class="workspace">
      <nav class="side-nav" aria-label="Primary navigation">
        <div class="nav-group">
          <button class="nav-item active" data-view="overview" aria-current="page" title="Overview" aria-label="Overview"><svg class="nav-icon"><use href="#icon-home"></use></svg><span class="nav-caption">Overview</span></button>
          <button class="nav-item" data-view="usage" title="Usage" aria-label="Usage"><svg class="nav-icon"><use href="#icon-chart"></use></svg><span class="nav-caption">Usage</span></button>
          <button class="nav-item" data-view="plans" title="Plans" aria-label="Plans"><svg class="nav-icon"><use href="#icon-layers"></use></svg><span class="nav-caption">Plans</span></button>
          <button class="nav-item" data-view="status" title="Status" aria-label="Status"><svg class="nav-icon"><use href="#icon-pulse"></use></svg><span class="nav-caption">Status</span></button>
          <button class="nav-item" data-view="settings" title="Settings" aria-label="Settings"><svg class="nav-icon"><use href="#icon-settings"></use></svg><span class="nav-caption">Settings</span></button>
        </div>
        <div class="nav-footer">
          <button class="account-chip" data-action="account" aria-label="Open account details" title="Account details">
            <span class="avatar">J</span><span class="account-copy"><strong>j***7</strong><small>Fixture account</small></span>
          </button>
        </div>
      </nav>

      <main class="content" id="app-content" aria-live="polite">
        <section class="loading-state" id="loading-state" role="status">
          <span class="loading-mark" aria-hidden="true"></span>
          <strong>Loading Cavoti snapshot</strong>
          <span>Waiting for the local host bridge.</span>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
