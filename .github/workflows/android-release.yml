name: Cavoti Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-release:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      ANDROID_NDK_VERSION: 29.0.14206865

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag and version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REF -notmatch '^refs/tags/v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "This workflow only signs semantic-version release tags."
          }
          $config = Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json
          if ($Matches.version -ne $config.version) {
            throw "Release tag version $($Matches.version) does not match tauri.conf.json version $($config.version)."
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$env:ANDROID_NDK_VERSION"
          $ndkHome = Join-Path $env:ANDROID_HOME "ndk\$env:ANDROID_NDK_VERSION"
          "NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.CAVOTI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "CAVOTI_ANDROID_KEYSTORE_BASE64 is required."
          }
          $path = Join-Path $env:RUNNER_TEMP "cavoti-bar-release.jks"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "CAVOTI_ANDROID_KEYSTORE_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Android APK
        shell: pwsh
        env:
          CAVOTI_ANDROID_KEY_ALIAS: ${{ secrets.CAVOTI_ANDROID_KEY_ALIAS }}
          CAVOTI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAVOTI_ANDROID_KEYSTORE_PASSWORD }}
          CAVOTI_ANDROID_KEY_PASSWORD: ${{ secrets.CAVOTI_ANDROID_KEY_PASSWORD }}
        run: .\scripts\build-tauri-android-release.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cavoti-bar-android-${{ github.ref_name }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/Cavoti Bar.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $deadline = (Get-Date).AddMinutes(15)
          do {
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) {
            throw "The Windows release was not available after 15 minutes."
          }
          $apk = Get-ChildItem -LiteralPath "src-tauri/gen/android/app/build/outputs/apk" -Recurse -Filter "Cavoti Bar.apk" -File
          if (@($apk).Count -ne 1) { throw "Expected exactly one branded release APK." }
          gh release upload $env:RELEASE_TAG $apk.FullName --clobber --repo $env:GITHUB_REPOSITORY
