name: Cavoti Android Release
run-name: Cavoti Android Release ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing draft release tag to package, for example v1.2.3
        required: true
        type: string
    secrets:
      CAVOTI_ANDROID_KEYSTORE_BASE64:
        required: true
      CAVOTI_ANDROID_KEY_ALIAS:
        required: true
      CAVOTI_ANDROID_KEYSTORE_PASSWORD:
        required: true
      CAVOTI_ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: cavoti-release-${{ inputs.release_tag }}-android
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  ANDROID_NDK_VERSION: 29.0.14206865
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  android-release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag, remote tag, versions, and draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:RELEASE_TAG"
          }
          $major = [long]$Matches.major
          $minor = [long]$Matches.minor
          $patch = [long]$Matches.patch
          if ($minor -ge 1000 -or $patch -ge 1000) {
            throw "Release minor and patch components must each be less than 1000."
          }
          $versionCode = ($major * 1000000) + ($minor * 1000) + $patch + 1
          if ($versionCode -le 0 -or $versionCode -gt 2100000000) {
            throw "Release version is outside the supported Android versionCode range."
          }
          $tagVersion = "$major.$minor.$patch"

          $remoteTagLines = @(git ls-remote origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) {
            throw "Remote tag $env:RELEASE_TAG does not exist exactly."
          }
          $remoteTagLine = $remoteTagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($remoteTagLine)) { $remoteTagLine = $remoteTagLines[0] }
          $remoteCommit = ($remoteTagLine -split '\s+')[0]
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $remoteCommit) {
            throw "Checked out commit $headCommit does not match remote tag commit $remoteCommit."
          }

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main for release provenance validation." }
          git merge-base --is-ancestor $headCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag commit is not reachable from origin/main." }

          $successfulCiRuns = & gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $headCommit --limit 20 --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length'
          if ($LASTEXITCODE -ne 0 -or [int]($successfulCiRuns -join "").Trim() -lt 1) {
            throw "Release tag commit does not have a successful Cavoti CI run."
          }

          $packageJson = Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json
          $tauriConfig = Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $cargoText = Get-Content -Raw -LiteralPath "src-tauri/Cargo.toml"
          $cargoMatch = [regex]::Match($cargoText, '(?ms)^\[package\]\s*.*?^\s*version\s*=\s*"(?<version>[^"]+)"')
          if (-not $cargoMatch.Success) { throw "Could not read the Cargo package version." }
          $installerProject = [xml](Get-Content -Raw -LiteralPath "installer/CavotiBarSetup.csproj")
          $versions = [ordered]@{
            "package.json" = [string]$packageJson.version
            "src-tauri/tauri.conf.json" = [string]$tauriConfig.version
            "src-tauri/Cargo.toml" = [string]$cargoMatch.Groups["version"].Value
            "installer/CavotiBarSetup.csproj" = [string]$installerProject.Project.PropertyGroup.Version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $tagVersion) {
              throw "$($entry.Key) version $($entry.Value) does not match tag version $tagVersion."
            }
          }

          $draft = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or ($draft -join "").Trim() -ne "true") {
            throw "Release $env:RELEASE_TAG must exist and remain draft before signing."
          }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$env:ANDROID_NDK_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed." }
          $ndkHome = Join-Path $env:ANDROID_HOME "ndk\$env:ANDROID_NDK_VERSION"
          "NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Android build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            src-tauri/target
          key: ${{ runner.os }}-cavoti-android-${{ hashFiles('**/Cargo.lock', 'bun.lock', 'src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-cavoti-android-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing keystore
        shell: pwsh
        env:
          CAVOTI_ANDROID_KEYSTORE_BASE64: ${{ secrets.CAVOTI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CAVOTI_ANDROID_KEYSTORE_BASE64)) {
            throw "CAVOTI_ANDROID_KEYSTORE_BASE64 is required."
          }
          $path = Join-Path $env:RUNNER_TEMP "cavoti-bar-release.jks"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CAVOTI_ANDROID_KEYSTORE_BASE64))
          "CAVOTI_ANDROID_KEYSTORE_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Android APK
        shell: pwsh
        env:
          CAVOTI_ANDROID_KEY_ALIAS: ${{ secrets.CAVOTI_ANDROID_KEY_ALIAS }}
          CAVOTI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAVOTI_ANDROID_KEYSTORE_PASSWORD }}
          CAVOTI_ANDROID_KEY_PASSWORD: ${{ secrets.CAVOTI_ANDROID_KEY_PASSWORD }}
        run: .\scripts\build-tauri-android-release.ps1

      - name: Prepare Android release asset
        shell: pwsh
        run: |
          $apk = @(Get-ChildItem -LiteralPath "src-tauri/gen/android/app/build/outputs/apk" -Recurse -Filter "Cavoti Bar.apk" -File)
          if ($apk.Count -ne 1) { throw "Expected exactly one branded release APK." }
          $output = Join-Path $env:GITHUB_WORKSPACE "release-assets\android"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath $apk[0].FullName -Destination (Join-Path $output "Cavoti-Bar-universal.apk") -Force

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v7
        with:
          name: cavoti-android-${{ inputs.release_tag }}
          path: release-assets/android
          if-no-files-found: error
