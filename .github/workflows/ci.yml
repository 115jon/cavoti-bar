name: Cavoti CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  renderer-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository contracts
        run: node --test tests/*.test.mjs

      - name: Typecheck renderer
        run: bun run typecheck

      - name: Test renderer
        run: bun run test

      - name: Check formatting
        run: bun run format:check

      - name: Lint renderer
        run: bun run lint

  rust:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri renderer
        run: bun run build:tauri

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test Rust host
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows bootstrapper
        run: dotnet build installer/CavotiBarSetup.csproj --configuration Release
