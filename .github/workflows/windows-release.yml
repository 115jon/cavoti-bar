name: Cavoti Windows Release
run-name: Cavoti Windows Release ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing draft release tag to package, for example v1.2.3
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: cavoti-release-${{ inputs.release_tag }}-windows
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  desktop-release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag, remote tag, versions, and draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:RELEASE_TAG"
          }
          $major = [long]$Matches.major
          $minor = [long]$Matches.minor
          $patch = [long]$Matches.patch
          if ($minor -ge 1000 -or $patch -ge 1000) {
            throw "Release minor and patch components must each be less than 1000."
          }
          $versionCode = ($major * 1000000) + ($minor * 1000) + $patch + 1
          if ($versionCode -le 0 -or $versionCode -gt 2100000000) {
            throw "Release version is outside the supported Android versionCode range."
          }
          $tagVersion = "$major.$minor.$patch"

          $remoteTagLines = @(git ls-remote origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0 -or $remoteTagLines.Count -eq 0) {
            throw "Remote tag $env:RELEASE_TAG does not exist exactly."
          }
          $remoteTagLine = $remoteTagLines | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($remoteTagLine)) { $remoteTagLine = $remoteTagLines[0] }
          $remoteCommit = ($remoteTagLine -split '\s+')[0]
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $remoteCommit) {
            throw "Checked out commit $headCommit does not match remote tag commit $remoteCommit."
          }

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main for release provenance validation." }
          git merge-base --is-ancestor $headCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag commit is not reachable from origin/main." }

          $successfulCiRuns = & gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $headCommit --limit 20 --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length'
          if ($LASTEXITCODE -ne 0 -or [int]($successfulCiRuns -join "").Trim() -lt 1) {
            throw "Release tag commit does not have a successful Cavoti CI run."
          }

          $packageJson = Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json
          $tauriConfig = Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $cargoText = Get-Content -Raw -LiteralPath "src-tauri/Cargo.toml"
          $cargoMatch = [regex]::Match($cargoText, '(?ms)^\[package\]\s*.*?^\s*version\s*=\s*"(?<version>[^"]+)"')
          if (-not $cargoMatch.Success) { throw "Could not read the Cargo package version." }
          $installerProject = [xml](Get-Content -Raw -LiteralPath "installer/CavotiBarSetup.csproj")
          $versions = [ordered]@{
            "package.json" = [string]$packageJson.version
            "src-tauri/tauri.conf.json" = [string]$tauriConfig.version
            "src-tauri/Cargo.toml" = [string]$cargoMatch.Groups["version"].Value
            "installer/CavotiBarSetup.csproj" = [string]$installerProject.Project.PropertyGroup.Version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $tagVersion) {
              throw "$($entry.Key) version $($entry.Value) does not match tag version $tagVersion."
            }
          }

          $draft = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or ($draft -join "").Trim() -ne "true") {
            throw "Release $env:RELEASE_TAG must exist and remain draft before signing."
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Windows build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            src-tauri/target
          key: ${{ runner.os }}-cavoti-windows-${{ hashFiles('**/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-cavoti-windows-

      - name: Setup .NET Framework build tools
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build custom Cavoti installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .\scripts\build-tauri-installer.ps1

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          $installer = "installer/bin/Release/net48/Cavoti Bar Setup.exe"
          $signature = "installer/bin/Release/net48/Cavoti Bar Setup.exe.sig"
          $latestPath = "installer/bin/Release/net48/latest.json"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Custom installer not found: $installer" }
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) { throw "Custom installer signature not found: $signature" }

          $config = Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $assetName = "CavotiBarSetup.exe"
          $encodedAssetName = [Uri]::EscapeDataString($assetName)
          $metadata = [ordered]@{
            version = [string]$config.version
            notes = "Cavoti Bar $($config.version)"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -Raw -LiteralPath $signature).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$encodedAssetName"
              }
            }
          }
          $metadata | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $latestPath -NoNewline


      - name: Prepare Windows release artifact
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "release-assets\windows"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath "installer/bin/Release/net48/Cavoti Bar Setup.exe" -Destination (Join-Path $output "CavotiBarSetup.exe") -Force
          Copy-Item -LiteralPath "installer/bin/Release/net48/Cavoti Bar Setup.exe.sig" -Destination (Join-Path $output "CavotiBarSetup.exe.sig") -Force
          Copy-Item -LiteralPath "installer/bin/Release/net48/latest.json" -Destination $output -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cavoti-windows-${{ inputs.release_tag }}
          path: release-assets/windows
          if-no-files-found: error
